# Pipeline for this extension.
#
#   lint.yml      coding standards (civilint) and PHP version compatibility
#   composer.yml  publishes a tag to the Composer Packages registry
#
# Both live in infra/extension-ci and are extension-agnostic, so there is
# nothing to configure here. See https://lab.civicrm.org/infra/gitlab/-/issues/50
#
# PHPUnit is not run from here: it runs in CiviCARROT, dispatched from the merge
# request. These scans need no CiviCRM, CMS or database, so they run natively on
# lab.civicrm.org's runners in well under a minute and give a merge request real
# red/green status rather than only the CARROT bot comment.
include:
  - project: 'infra/extension-ci'
    ref: main
    file:
      - '/lint.yml'
      - '/composer.yml'
